<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyktig tavla - Nedladdningsbar version</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-pulse-button { animation: buttonPulse 2s infinite; }
        @keyframes buttonPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } }
        .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Enkel komponent för Lucide-ikoner eftersom vi kör via CDN
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function StatsPage() {
            const [stats, setStats] = useState({ totalRooms: 0, totalUsers: 0, rooms: [] });
            const [loading, setLoading] = useState(true);
            const statsRefreshRef = useRef(null);

            useEffect(() => {
                console.log('StatsPage mounted');
                setLoading(true);

                const fetchStats = async () => {
                    try {
                        const response = await fetch('/api/stats');
                        const data = await response.json();
                        console.log('Fetched stats:', data);
                        setStats(data);
                        setLoading(false);
                    } catch (error) {
                        console.error('Failed to fetch stats:', error);
                        setLoading(false);
                    }
                };

                fetchStats();
                statsRefreshRef.current = setInterval(fetchStats, 2000);

                return () => {
                    console.log('StatsPage unmounting');
                    clearInterval(statsRefreshRef.current);
                };
            }, []);

            if (loading) {
                return (
                    <div className="flex flex-col h-screen bg-slate-50 items-center justify-center">
                        <div className="text-center">
                            <div className="w-12 h-12 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-slate-600">Hämtar statistik...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen bg-slate-50">
                    <header className="bg-white border-b px-6 py-4 shadow-sm">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-lg flex items-center justify-center">
                                    <Icon name="bar-chart-3" className="text-white w-5 h-5" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg">Statistik</h1>
                                    <p className="text-xs text-slate-400 uppercase tracking-widest font-semibold">Realtids dashboard</p>
                                </div>
                            </div>
                            <button
                                onClick={() => {
                                    window.history.back();
                                }}
                                className="flex items-center gap-2 text-indigo-600 hover:text-indigo-700 hover:bg-indigo-50 px-4 py-2 rounded-lg transition-all font-semibold text-sm"
                            >
                                <Icon name="arrow-left" size={16} />
                                Tillbaka
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-6">
                        <div className="max-w-4xl mx-auto">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                                    <div className="text-slate-500 text-sm font-semibold uppercase mb-1">Aktiva tavlor</div>
                                    <div className="text-4xl font-bold text-indigo-600">{stats.totalRooms}</div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                                    <div className="text-slate-500 text-sm font-semibold uppercase mb-1">Aktiva användare</div>
                                    <div className="text-4xl font-bold text-green-600">{stats.totalUsers}</div>
                                </div>
                            </div>

                            <div>
                                <h2 className="text-lg font-bold text-slate-900 mb-4">Tavlor</h2>
                                {stats.rooms.length === 0 ? (
                                    <div className="bg-white border border-dashed border-slate-200 rounded-xl p-8 text-center">
                                        <Icon name="inbox" size={48} className="mx-auto mb-3 text-slate-300" />
                                        <p className="text-slate-500">Inga aktiva tavlor just nu</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-4">
                                        {stats.rooms.map((room) => (
                                            <a
                                                key={room.id}
                                                href={`/#${room.id}`}
                                                className="block bg-white border border-slate-200 rounded-xl p-4 hover:border-indigo-500 hover:shadow-md transition-all"
                                            >
                                                <div className="flex items-start justify-between mb-3">
                                                    <div className="flex-1 min-w-0">
                                                        <h3 className="font-bold text-slate-900 truncate text-lg">{room.title}</h3>
                                                        <p className="text-xs text-slate-400 font-mono">{room.id}</p>
                                                    </div>
                                                    <div className="text-right shrink-0 ml-4">
                                                        <div className="text-sm font-bold text-slate-900">{room.userCount} användare</div>
                                                        <div className="text-xs text-slate-500">{room.messageCount} meddelanden</div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2 text-xs text-indigo-600 hover:text-indigo-700">
                                                    <Icon name="link-2" size={14} />
                                                    Gå till tavla
                                                </div>
                                            </a>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="bg-white border-t p-4 text-center">
                        <p className="text-xs text-slate-400">Uppdateras var 2:a sekund</p>
                    </footer>
                </div>
            );
        }

        function App() {
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [boardTitle, setBoardTitle] = useState('Flyktig tavla');
            const [isEditingTitle, setIsEditingTitle] = useState(false);
            const [file, setFile] = useState(null);
            const [showShareModal, setShowShareModal] = useState(false);
            const [copied, setCopied] = useState(false);
            const [userCount, setUserCount] = useState(0);
            const [roomId, setRoomId] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState('');
            const [showVersion, setShowVersion] = useState(false);
            const [imageSize, setImageSize] = useState('full'); // 'full', 'half', 'small'
            const [displayMode, setDisplayMode] = useState('normal'); // 'normal', 'dynamic'
            const [expandedMessageId, setExpandedMessageId] = useState(null);
            const [currentPage, setCurrentPage] = useState(() => {
                return window.location.pathname === '/stats' ? 'stats' : 'board';
            });
            const socketRef = useRef(null);
            const messagesEndRef = useRef(null);
            const titleInputRef = useRef(null);
            const version = '1.1.0';

            const getImageSizeStyle = () => {
                switch(imageSize) {
                    case 'half': return { width: '50%', height: 'auto' };
                    case 'small': return { width: '25%', height: 'auto' };
                    default: return { width: '100%', height: 'auto' };
                }
            };

            const getImageSizeLabel = () => {
                switch(imageSize) {
                    case 'half': return '50%';
                    case 'small': return '25%';
                    default: return '100%';
                }
            };

            const toggleImageSize = () => {
                if (imageSize === 'full') setImageSize('half');
                else if (imageSize === 'half') setImageSize('small');
                else setImageSize('full');
            };

            // Monitor browser back/forward navigation
            useEffect(() => {
                const handlePopState = () => {
                    console.log('Popstate - URL now:', window.location.pathname);
                    if (window.location.pathname === '/stats') {
                        setCurrentPage('stats');
                    } else {
                        setCurrentPage('board');
                    }
                };

                // Listen for back/forward button navigation
                window.addEventListener('popstate', handlePopState);

                // Also listen for hashchange to catch when user clicks on board links from stats
                const handleHashChange = () => {
                    console.log('Hash changed to:', window.location.hash);
                    setCurrentPage('board');
                };
                window.addEventListener('hashchange', handleHashChange);

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    window.removeEventListener('hashchange', handleHashChange);
                };
            }, []);

            // Initialize Socket.io connection and room for board page
            useEffect(() => {
                // If on stats page, disconnect any existing socket
                if (currentPage === 'stats') {
                    if (socketRef.current) {
                        socketRef.current.disconnect();
                        socketRef.current = null;
                    }
                    return;
                }

                // Get or create room ID from URL hash
                let currentRoomId = window.location.hash.slice(1);
                if (!currentRoomId || currentRoomId.length === 0) {
                    currentRoomId = Math.random().toString(36).slice(2, 8);
                    window.location.hash = currentRoomId;
                }
                setRoomId(currentRoomId);

                // Connect to server
                const socket = io();
                socketRef.current = socket;

                socket.on('connect', () => {
                    socket.emit('join-room', currentRoomId);
                });

                socket.on('room-state', (state) => {
                    setMessages(state.messages || []);
                    setUserCount(state.userCount || 0);
                    if (state.title) {
                        setBoardTitle(state.title);
                    }
                });

                socket.on('new-message', (message) => {
                    console.log('Received message:', message);
                    if (message.file) {
                        console.log('Message has file:', message.file.name);
                    }
                    setMessages(prev => [...prev, message]);
                    setTimeout(() => {
                        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                    }, 50);
                });

                socket.on('delete-message', (id) => {
                    setMessages(prev => prev.filter(m => m.id !== id));
                });

                socket.on('clear-board', () => {
                    setMessages([]);
                });

                socket.on('user-count', (count) => {
                    setUserCount(count);
                });

                socket.on('edit-message', ({ id, text }) => {
                    setMessages(prev => prev.map(m => m.id === id ? { ...m, text } : m));
                });

                socket.on('board-title-change', (newTitle) => {
                    console.log('Board title changed by another user:', newTitle);
                    setBoardTitle(newTitle);
                });

                return () => {
                    socket.disconnect();
                };
            }, [currentPage]);

            useEffect(() => {
                document.title = boardTitle;
            }, [boardTitle]);

            useEffect(() => {
                const handleEscapeKey = (e) => {
                    if (e.key === 'Escape') {
                        setExpandedMessageId(null);
                        setShowShareModal(false);
                    }
                };

                window.addEventListener('keydown', handleEscapeKey);
                return () => window.removeEventListener('keydown', handleEscapeKey);
            }, []);

            useEffect(() => {
                if (isEditingTitle && titleInputRef.current) {
                    titleInputRef.current.focus();
                    titleInputRef.current.select();
                }
            }, [isEditingTitle]);

            const scrollToBottom = () => {
                setTimeout(() => {
                    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                }, 50);
            };

            const handleSendMessage = (e) => {
                if (e) e.preventDefault();
                if (!newMessage.trim() && !file) return;

                // Validate file size (10 MB max)
                if (file && file.size > 10 * 1024 * 1024) {
                    alert('Filen är för stor. Max 10 MB.');
                    return;
                }

                const newMsg = {
                    id: Date.now(),
                    text: newMessage,
                    file: null,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                };

                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const isImage = file.type.startsWith('image/');
                        newMsg.file = {
                            name: file.name,
                            type: file.type,
                            size: (file.size / 1024).toFixed(1) + " KB",
                            data: event.target.result, // base64
                            isImage: isImage
                        };
                        console.log('Sending file:', newMsg.file.name, 'Size:', newMsg.file.size, 'IsImage:', isImage);
                        // Send via Socket.io
                        if (socketRef.current) {
                            socketRef.current.emit('new-message', newMsg);
                        }
                        setNewMessage('');
                        setFile(null);
                    };
                    reader.onerror = (error) => {
                        console.error('File read error:', error);
                    };
                    reader.readAsDataURL(file);
                } else {
                    // Send message without file
                    if (socketRef.current) {
                        socketRef.current.emit('new-message', newMsg);
                    }
                    setNewMessage('');
                    setFile(null);
                }
            };

            const deleteMessage = (id) => {
                if (socketRef.current) {
                    socketRef.current.emit('delete-message', id);
                }
            };

            const clearBoard = () => {
                if (socketRef.current) {
                    socketRef.current.emit('clear-board');
                }
            };

            const saveEdit = (id) => {
                // Update optimistically
                setMessages(prev => prev.map(m => m.id === id ? { ...m, text: editText } : m));
                setEditingId(null);
                // Then send to server
                if (socketRef.current) {
                    socketRef.current.emit('edit-message', { id, text: editText });
                }
            };

            const copyToClipboard = () => {
                const url = window.location.href;
                navigator.clipboard.writeText(url).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            // Determine which page to show - check pathname directly for reliability
            const pathName = window.location.pathname;
            console.log('Rendering - currentPage:', currentPage, 'pathname:', pathName);

            if (pathName === '/stats') {
                return <StatsPage />;
            }

            return (
                <div className="flex flex-col h-screen text-slate-900">
                    {/* Header */}
                    <header className="bg-white border-b px-3 sm:px-6 py-3 sm:py-4 flex justify-between items-center shadow-sm z-10 flex-wrap gap-2">
                        <div className="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
                            <div className="bg-indigo-600 p-1.5 sm:p-2 rounded-lg shrink-0 flex items-center justify-center">
                                <Icon name="message-square" size={18} className="text-white sm:w-5 sm:h-5" />
                            </div>
                            <div className="flex flex-col min-w-0">
                                {isEditingTitle ? (
                                    <input
                                        ref={titleInputRef}
                                        type="text"
                                        value={boardTitle}
                                        onChange={(e) => setBoardTitle(e.target.value)}
                                        onBlur={() => {
                                            setIsEditingTitle(false);
                                            if (socketRef.current) {
                                                socketRef.current.emit('board-title-change', boardTitle);
                                            }
                                        }}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                setIsEditingTitle(false);
                                                if (socketRef.current) {
                                                    socketRef.current.emit('board-title-change', boardTitle);
                                                }
                                            }
                                        }}
                                        className="font-bold text-base sm:text-lg leading-tight border-b-2 border-indigo-500 outline-none bg-transparent w-full"
                                    />
                                ) : (
                                    <div
                                        className="flex items-center gap-1 sm:gap-2 group cursor-pointer"
                                        onClick={() => setIsEditingTitle(true)}
                                    >
                                        <h1 className="font-bold text-base sm:text-lg leading-tight truncate">
                                            {boardTitle || 'Namnlös Tavla'}
                                        </h1>
                                        <Icon name="edit-2" size={12} className="text-slate-300 group-hover:text-indigo-500 transition-colors shrink-0 hidden sm:block" />
                                    </div>
                                )}
                                <p className="text-[8px] sm:text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Ingen lagring</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1 sm:gap-2 shrink-0">
                            {userCount > 0 && (
                                <span className="text-xs text-slate-500 font-medium px-2 sm:px-3 py-1 bg-slate-100 rounded-full">
                                    {userCount}
                                </span>
                            )}
                            {messages.length > 0 && (
                                <>
                                    <button onClick={() => setDisplayMode(displayMode === 'normal' ? 'dynamic' : 'normal')} title={displayMode === 'normal' ? 'Växla till dynamiskt läge' : 'Växla till normalt läge'} className="p-1.5 sm:p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-all text-xs font-semibold" style={{minWidth: '32px'}}>
                                        {displayMode === 'normal' ? 'N' : 'D'}
                                    </button>
                                    <button onClick={toggleImageSize} title="Ändra bildstorlek" className="p-1.5 sm:p-2 text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 rounded-full transition-all" style={{fontSize: '11px', fontWeight: '600', minWidth: '32px'}}>
                                        {getImageSizeLabel()}
                                    </button>
                                    <button onClick={clearBoard} className="p-1.5 sm:p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-all">
                                        <Icon name="trash-2" size={16} />
                                    </button>
                                </>
                            )}
                            <button onClick={() => setShowShareModal(true)} className="flex items-center gap-1 sm:gap-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 sm:px-4 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm font-semibold">
                                <Icon name="share-2" size={14} /> <span className="hidden sm:inline">Dela</span>
                            </button>
                        </div>
                    </header>

                    <div className="bg-indigo-600 text-white px-3 sm:px-6 py-2 flex items-center justify-center gap-2 text-xs text-center">
                        <Icon name="info" size={12} className="shrink-0" />
                        <span>Tavlan raderas när alla lämnar</span>
                    </div>

                    {/* Board */}
                    <main className="flex-1 overflow-y-auto p-3 sm:p-6">
                        <div className="max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                            {messages.length === 0 && (
                                <div className="col-span-full flex flex-col items-center justify-center py-12 sm:py-20 text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl sm:rounded-3xl">
                                    <Icon name="message-square" size={40} className="mb-3 sm:mb-4 opacity-20 sm:w-12 sm:h-12" />
                                    <p className="font-medium text-base sm:text-lg text-slate-500">Tavlan är redo</p>
                                    <p className="text-sm text-center">Skriv något nedan för att börja.</p>
                                </div>
                            )}
                            
                            {messages.map((msg) => (
                                <div key={msg.id} className="p-3 sm:p-4 rounded-xl sm:rounded-2xl shadow-sm border border-slate-200 bg-white animate-in relative group">
                                    <div className="absolute top-2 right-2 sm:top-3 sm:right-3 flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-all">
                                        <button onClick={() => { setEditingId(msg.id); setEditText(msg.text); }} className="p-1 text-slate-300 hover:text-indigo-500 hover:bg-indigo-50 rounded-md transition-all">
                                            <Icon name="edit-2" size={14} className="sm:w-4 sm:h-4" />
                                        </button>
                                        <button onClick={() => deleteMessage(msg.id)} className="p-1 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-md transition-all">
                                            <Icon name="x" size={14} className="sm:w-4 sm:h-4" />
                                        </button>
                                    </div>
                                    <div className="flex items-center gap-2 mb-2 sm:mb-3">
                                        <div className="w-5 sm:w-6 h-5 sm:h-6 rounded-full bg-indigo-100 flex items-center justify-center shrink-0">
                                            <Icon name="user" size={10} className="text-indigo-600 sm:w-3 sm:h-3" />
                                        </div>
                                        <span className="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Inlägg</span>
                                    </div>
                                    {msg.text !== undefined && (
                                        editingId === msg.id ? (
                                            <textarea
                                                autoFocus
                                                value={editText}
                                                onChange={(e) => setEditText(e.target.value)}
                                                onBlur={() => saveEdit(msg.id)}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(msg.id); }
                                                    if (e.key === 'Escape') setEditingId(null);
                                                }}
                                                className="w-full text-slate-800 text-sm leading-relaxed bg-slate-50 border border-indigo-300 rounded-md sm:rounded-lg px-2 py-1 resize-none outline-none focus:ring-2 focus:ring-indigo-400 mb-3"
                                                rows={3}
                                            />
                                        ) : displayMode === 'normal' ? (
                                            <div className="mb-3 relative">
                                                <p
                                                    className="text-slate-800 whitespace-pre-wrap leading-relaxed text-sm pr-8 cursor-text hover:bg-slate-50 rounded px-1 -mx-1 line-clamp-4"
                                                    onClick={() => { setEditingId(msg.id); setEditText(msg.text); }}
                                                >
                                                    {msg.text}
                                                </p>
                                                {msg.text.split('\n').length > 4 || msg.text.length > 200 ? (
                                                    <button
                                                        onClick={() => setExpandedMessageId(msg.id)}
                                                        className="absolute bottom-0 right-0 text-indigo-600 hover:text-indigo-700 font-semibold text-sm bg-white px-1"
                                                    >
                                                        ...
                                                    </button>
                                                ) : null}
                                            </div>
                                        ) : (
                                            <div className="mb-3 bg-slate-50 rounded p-2 max-h-96 overflow-y-auto">
                                                <p
                                                    className="text-slate-800 whitespace-pre-wrap leading-relaxed text-sm cursor-text"
                                                    onClick={() => { setEditingId(msg.id); setEditText(msg.text); }}
                                                >
                                                    {msg.text}
                                                </p>
                                            </div>
                                        )
                                    )}
                                    {msg.file && (
                                        <div className="bg-blue-50 border border-blue-200 rounded-md overflow-hidden">
                                            {msg.file.isImage ? (
                                                <div className="flex flex-col">
                                                    <img src={msg.file.data} alt={msg.file.name} style={{...getImageSizeStyle(), objectFit: 'cover'}} className="w-full" />
                                                    <div className="flex items-center justify-between gap-1.5 px-2 py-1.5">
                                                        <div className="flex flex-col overflow-hidden min-w-0">
                                                            <span className="text-xs font-bold truncate text-slate-700">{msg.file.name}</span>
                                                            <span className="text-[8px] text-slate-400">{msg.file.size}</span>
                                                        </div>
                                                        {msg.file.data && (
                                                            <button
                                                                onClick={async () => {
                                                                    try {
                                                                        const response = await fetch(msg.file.data);
                                                                        const blob = await response.blob();
                                                                        const url = URL.createObjectURL(blob);
                                                                        const link = document.createElement('a');
                                                                        link.href = url;
                                                                        link.download = msg.file.name;
                                                                        document.body.appendChild(link);
                                                                        link.click();
                                                                        document.body.removeChild(link);
                                                                        URL.revokeObjectURL(url);
                                                                    } catch (error) {
                                                                        console.error('Download failed:', error);
                                                                        alert('Nedladdning misslyckades');
                                                                    }
                                                                }}
                                                                className="p-1 hover:bg-blue-100 text-blue-600 rounded shrink-0"
                                                            >
                                                                <Icon name="download" size={14} />
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="flex items-center justify-between gap-1.5 p-2">
                                                    <div className="flex items-center gap-2 overflow-hidden">
                                                        <div className="bg-blue-500 p-1 rounded text-white shrink-0">
                                                            <Icon name="file-text" size={12} />
                                                        </div>
                                                        <div className="flex flex-col overflow-hidden min-w-0">
                                                            <span className="text-xs font-bold truncate text-slate-700">{msg.file.name}</span>
                                                            <span className="text-[8px] text-slate-400">{msg.file.size}</span>
                                                        </div>
                                                    </div>
                                                    {msg.file.data && (
                                                        <button
                                                            onClick={async () => {
                                                                try {
                                                                    const response = await fetch(msg.file.data);
                                                                    const blob = await response.blob();
                                                                    const url = URL.createObjectURL(blob);
                                                                    const link = document.createElement('a');
                                                                    link.href = url;
                                                                    link.download = msg.file.name;
                                                                    document.body.appendChild(link);
                                                                    link.click();
                                                                    document.body.removeChild(link);
                                                                    URL.revokeObjectURL(url);
                                                                } catch (error) {
                                                                    console.error('Download failed:', error);
                                                                    alert('Nedladdning misslyckades');
                                                                }
                                                            }}
                                                            className="p-1 hover:bg-blue-100 text-blue-600 rounded shrink-0"
                                                        >
                                                            <Icon name="download" size={14} />
                                                        </button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    <div className="mt-2 sm:mt-3 text-[9px] sm:text-[10px] text-slate-300 text-right font-medium">{msg.timestamp}</div>
                                </div>
                            ))}
                            <div ref={messagesEndRef} />
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t p-3 sm:p-4">
                        <form onSubmit={handleSendMessage} className="max-w-4xl mx-auto">
                            <div className="flex flex-col gap-2 sm:gap-3">
                                {file && (
                                    <div className="flex items-center justify-between bg-indigo-50 px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl border border-indigo-100 text-sm gap-2">
                                        {file.type.startsWith('image/') ? (
                                            <div className="flex items-center gap-2 overflow-hidden flex-1">
                                                <img src={URL.createObjectURL(file)} alt={file.name} className="w-10 h-10 sm:w-12 sm:h-12 object-cover rounded shrink-0" />
                                                <div className="flex flex-col overflow-hidden flex-1">
                                                    <span className="text-xs font-bold text-indigo-700 truncate">{file.name}</span>
                                                    <span className="text-[10px] text-indigo-600">{(file.size / 1024).toFixed(1)} KB</span>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-2 overflow-hidden flex-1">
                                                <Icon name="paperclip" size={14} className="text-indigo-500 shrink-0" />
                                                <span className="text-xs font-bold text-indigo-700 truncate">{file.name}</span>
                                            </div>
                                        )}
                                        <button type="button" onClick={() => setFile(null)} className="text-indigo-400 hover:text-indigo-600 p-1 shrink-0 ml-auto"><Icon name="x" size={14}/></button>
                                    </div>
                                )}
                                <div className="flex items-end gap-2">
                                    <div className="flex-1 relative">
                                        <textarea
                                            value={newMessage}
                                            onChange={(e) => setNewMessage(e.target.value)}
                                            placeholder="Skriv något..."
                                            className="w-full border border-slate-200 rounded-xl sm:rounded-2xl px-3 sm:px-4 py-2 sm:py-4 pr-10 sm:pr-12 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none max-h-32 min-h-[44px] sm:min-h-[56px] text-sm shadow-inner"
                                            rows="1"
                                            onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } }}
                                        />
                                        <label className="absolute right-2 sm:right-3 bottom-2 sm:bottom-3 cursor-pointer p-1.5 hover:bg-slate-100 rounded-lg shrink-0">
                                            <input type="file" className="hidden" onChange={(e) => setFile(e.target.files[0])} />
                                            <Icon name="paperclip" size={18} className="text-slate-400" />
                                        </label>
                                    </div>
                                    <button type="submit" disabled={!newMessage.trim() && !file} className={`text-white p-2.5 sm:p-4 rounded-xl sm:rounded-2xl shadow-md transition-all active:scale-95 shrink-0 ${(file || newMessage.trim()) ? 'bg-indigo-700 animate-pulse-button' : 'bg-indigo-600 hover:bg-indigo-700'} ${!newMessage.trim() && !file ? 'disabled:bg-slate-200' : ''}`}>
                                        <Icon name="send" size={18} className="sm:w-6 sm:h-6" />
                                    </button>
                                </div>
                                <div className="flex items-center justify-between text-[10px] text-slate-400 px-1">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            window.history.pushState({}, '', '/stats');
                                            setCurrentPage('stats');
                                        }}
                                        className="hover:text-indigo-500 transition-colors cursor-pointer"
                                    >
                                        Statistik
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowVersion(!showVersion)}
                                        className="hover:text-slate-500 transition-colors cursor-pointer"
                                    >
                                        v{version}
                                    </button>
                                </div>
                            </div>
                        </form>
                    </footer>

                    {/* Expand Message Modal */}
                    {expandedMessageId && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-md">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col relative">
                                <button onClick={() => setExpandedMessageId(null)} className="absolute top-3 right-3 p-2 text-slate-400 hover:text-slate-600 z-10"><Icon name="x" size={20}/></button>
                                <div className="p-4 sm:p-6 max-h-96 overflow-y-auto">
                                    <h3 className="text-sm font-semibold text-slate-400 mb-3 uppercase">Fullständigt innehål</h3>
                                    <p className="text-slate-800 whitespace-pre-wrap leading-relaxed">
                                        {messages.find(m => m.id === expandedMessageId)?.text}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Share Modal */}
                    {showShareModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-md">
                            <div className="bg-white rounded-2xl sm:rounded-[32px] shadow-2xl w-full max-w-sm overflow-hidden p-4 sm:p-8 flex flex-col items-center relative">
                                <button onClick={() => setShowShareModal(false)} className="absolute top-3 right-3 p-2 text-slate-400 hover:text-slate-600 z-10"><Icon name="x" size={20}/></button>
                                <div className="bg-indigo-600 p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl shadow-indigo-100 mb-4 sm:mb-6 flex items-center justify-center">
                                    <Icon name="share-2" size={48} className="text-white sm:w-16 sm:h-16" />
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">Dela Tavlan</h3>
                                <p className="text-center text-sm text-slate-500 mb-2 sm:mb-3 leading-relaxed">Skicka denna länk för att dela tavlan med andra.</p>
                                <p className="text-center text-xs text-slate-400 mb-4 sm:mb-6 leading-relaxed px-2 py-2 bg-slate-50 rounded-lg">📎 Textmeddelanden synkas mellan användare.</p>
                                <div className="flex flex-col items-center gap-2 sm:gap-4 mb-4 sm:mb-6 w-full">
                                    <img
                                        src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(window.location.href)}`}
                                        alt="QR Code"
                                        className="border-4 border-slate-200 rounded-lg sm:rounded-xl w-40 h-40 sm:w-48 sm:h-48"
                                    />
                                    <p className="text-[10px] text-slate-400 text-center">Skanna med kameran</p>
                                </div>
                                <button onClick={copyToClipboard} className={`w-full flex items-center justify-center gap-2 py-3 sm:py-4 rounded-2xl font-bold transition-all shadow-lg ${copied ? 'bg-green-500 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                                    {copied ? <><Icon name="check" size={18}/> Kopierat!</> : <><Icon name="copy" size={18}/> Kopiera Länk</>}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyktig tavla - Nedladdningsbar version</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-pulse-button { animation: buttonPulse 2s infinite; }
        @keyframes buttonPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } }
        .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        // === REACT APP (SPA) ===
        // Single Page Application with client-side routing and WebSocket real-time sync.
        // Components: Icon (icon wrapper), StatsPage (room list), App (main board UI).

        const { useState, useRef, useEffect } = React;

        /**
         * Icon Component
         * Thin wrapper around Lucide CDN icons.
         * Lucide requires createIcons() to be called after render to convert <i> to <svg>.
         */
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        /**
         * StatsPage Component
         * Displays a list of all active rooms, with user counts and live stats.
         * PIN-modal for PIN entry when clicking on a room.
         * Polls /api/stats every 2 seconds to keep numbers fresh.
         */
        function StatsPage() {
            const [stats, setStats] = useState({ totalRooms: 0, totalUsers: 0, rooms: [] });
            const [loading, setLoading] = useState(true);
            const [pinModal, setPinModal] = useState(null); // { roomId } when PIN-modal is open
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState('');
            const [pinLoading, setPinLoading] = useState(false);
            const statsRefreshRef = useRef(null);

            /**
             * handleVerifyPin
             * POST to /api/verify-pin with roomId and PIN. On success, navigate to board.
             */
            const handleVerifyPin = async () => {
                setPinLoading(true);
                setPinError('');
                try {
                    const response = await fetch('/api/verify-pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roomId: pinModal.roomId, pin: pinInput })
                    });
                    const data = await response.json();
                    setPinLoading(false);
                    if (data.success) {
                        window.location.href = `/#${pinModal.roomId}`;
                    } else {
                        setPinError(data.error || 'Fel PIN');
                    }
                } catch (error) {
                    console.error('PIN verification error:', error);
                    setPinError('Något gick fel');
                    setPinLoading(false);
                }
            };

            useEffect(() => {
                console.log('StatsPage mounted');
                setLoading(true);

                const fetchStats = async () => {
                    try {
                        const response = await fetch('/api/stats');
                        const data = await response.json();
                        console.log('Fetched stats:', data);
                        setStats(data);
                        setLoading(false);
                    } catch (error) {
                        console.error('Failed to fetch stats:', error);
                        setLoading(false);
                    }
                };

                fetchStats();
                statsRefreshRef.current = setInterval(fetchStats, 2000);

                return () => {
                    console.log('StatsPage unmounting');
                    clearInterval(statsRefreshRef.current);
                };
            }, []);

            if (loading) {
                return (
                    <div className="flex flex-col h-screen bg-slate-50 items-center justify-center">
                        <div className="text-center">
                            <div className="w-12 h-12 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-slate-600">Hämtar statistik...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen bg-slate-50">
                    <header className="bg-white border-b px-6 py-4 shadow-sm">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-lg flex items-center justify-center">
                                    <Icon name="bar-chart-3" className="text-white w-5 h-5" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg">Statistik</h1>
                                    <p className="text-xs text-slate-400 uppercase tracking-widest font-semibold">Realtids dashboard</p>
                                </div>
                            </div>
                            <button
                                onClick={() => {
                                    window.history.back();
                                }}
                                className="flex items-center gap-2 text-indigo-600 hover:text-indigo-700 hover:bg-indigo-50 px-4 py-2 rounded-lg transition-all font-semibold text-sm"
                            >
                                <Icon name="arrow-left" size={16} />
                                Tillbaka
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-6">
                        <div className="max-w-4xl mx-auto">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                                    <div className="text-slate-500 text-sm font-semibold uppercase mb-1">Aktiva tavlor</div>
                                    <div className="text-4xl font-bold text-indigo-600">{stats.totalRooms}</div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                                    <div className="text-slate-500 text-sm font-semibold uppercase mb-1">Aktiva användare</div>
                                    <div className="text-4xl font-bold text-green-600">{stats.totalUsers}</div>
                                </div>
                            </div>

                            <div>
                                <h2 className="text-lg font-bold text-slate-900 mb-4">Tavlor</h2>
                                {stats.rooms.length === 0 ? (
                                    <div className="bg-white border border-dashed border-slate-200 rounded-xl p-8 text-center">
                                        <Icon name="inbox" size={48} className="mx-auto mb-3 text-slate-300" />
                                        <p className="text-slate-500">Inga aktiva tavlor just nu</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-4">
                                        {stats.rooms.map((room) => (
                                            <button
                                                key={room.id}
                                                onClick={() => {
                                                    setPinModal({ roomId: room.id });
                                                    setPinInput('');
                                                    setPinError('');
                                                }}
                                                className="w-full text-left bg-white border border-slate-200 rounded-xl p-4 hover:border-indigo-500 hover:shadow-md transition-all"
                                            >
                                                <div className="flex items-start justify-between mb-3">
                                                    <div className="flex-1 min-w-0">
                                                        <h3 className="font-bold text-slate-900 truncate text-lg">{room.title}</h3>
                                                        <p className="text-xs text-slate-400 font-mono">{room.id}</p>
                                                    </div>
                                                    <div className="text-right shrink-0 ml-4">
                                                        <div className="text-sm font-bold text-slate-900">{room.userCount} användare</div>
                                                        <div className="text-xs text-slate-500">{room.messageCount} meddelanden</div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2 text-xs text-indigo-600 hover:text-indigo-700">
                                                    <Icon name="lock" size={14} />
                                                    Ange PIN för att ansluta
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="bg-white border-t p-4 text-center">
                        <p className="text-xs text-slate-400">Uppdateras var 2:a sekund</p>
                    </footer>

                    {/* PIN Modal */}
                    {pinModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-md">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col relative">
                                <button onClick={() => setPinModal(null)} className="absolute top-3 right-3 p-2 text-slate-400 hover:text-slate-600 z-10"><Icon name="x" size={20}/></button>
                                <div className="p-6">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Ange PIN-kod</h3>
                                    <p className="text-sm text-slate-600 mb-6">Denna tavla är skyddad. Ange PIN-koden för att ansluta.</p>
                                    <input
                                        type="number"
                                        value={pinInput}
                                        onChange={(e) => setPinInput(e.target.value.slice(0, 4))}
                                        onKeyPress={(e) => e.key === 'Enter' && handleVerifyPin()}
                                        placeholder="0000"
                                        maxLength="4"
                                        className="w-full border-2 border-slate-300 rounded-lg px-4 py-3 text-2xl text-center tracking-[0.5em] font-mono focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 mb-4"
                                        autoFocus
                                    />
                                    {pinError && <p className="text-sm text-red-600 mb-4">{pinError}</p>}
                                    <button
                                        onClick={handleVerifyPin}
                                        disabled={pinLoading || pinInput.length !== 4}
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3 rounded-lg transition-all"
                                    >
                                        {pinLoading ? 'Verifierar...' : 'Anslut'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /**
         * App Component
         * Main UI for the collaborative board. Handles routing (board vs /stats),
         * Socket.io connection, and all user interactions (messages, edits, deletes, etc.).
         */
        function App() {
            // === BOARD STATE ===
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [boardTitle, setBoardTitle] = useState('Flyktig tavla');
            const [isEditingTitle, setIsEditingTitle] = useState(false);

            // === FILE UPLOAD STATE ===
            const [file, setFile] = useState(null); // Pending file to send
            const [uploadError, setUploadError] = useState(''); // Error message from upload

            // === UI/MODAL STATE ===
            const [showShareModal, setShowShareModal] = useState(false);
            const [copied, setCopied] = useState(false);
            const [copiedMessageId, setCopiedMessageId] = useState(null); // For text copy feedback
            const [showVersion, setShowVersion] = useState(false);
            const [previewImage, setPreviewImage] = useState(null); // { src, name } when lightbox is open
            // First-visit welcome modal: shown once per device, using localStorage as the flag.
            const [showWelcome, setShowWelcome] = useState(() => !localStorage.getItem('flyktig_welcomed'));

            // === MESSAGE EDITING STATE ===
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState('');
            const [expandedMessageId, setExpandedMessageId] = useState(null);
            const [editingLabelId, setEditingLabelId] = useState(null);
            const [editLabelText, setEditLabelText] = useState('');

            // === IMAGE & DISPLAY STATE ===
            const [imageSize, setImageSize] = useState('full'); // 'full', 'half', 'small'
            const [displayMode, setDisplayMode] = useState('normal'); // 'normal' (clamped), 'dynamic' (scrollable)

            // === ROOM & USER STATE ===
            const [roomId, setRoomId] = useState(null);
            const [userCount, setUserCount] = useState(0);
            const [boardPin, setBoardPin] = useState(''); // From room-state

            // === PIN MODAL STATE ===
            const [pinModal, setPinModal] = useState(null); // { roomId } when modal open
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState('');
            const [pinLoading, setPinLoading] = useState(false);

            // === ROUTING STATE ===
            // 'board' or 'stats'. Derived from window.location.pathname.
            // Checked directly in render() to avoid race conditions.
            const [currentPage, setCurrentPage] = useState(() => {
                return window.location.pathname === '/stats' ? 'stats' : 'board';
            });

            // === REFS ===
            const socketRef = useRef(null); // Socket.io client instance
            const messagesEndRef = useRef(null); // Sentinel for scrollIntoView
            const titleInputRef = useRef(null); // For auto-focus on title edit
            const hoveredImageRef = useRef(null); // Tracks which image msg.id the mouse is currently over
            const previewImgRef = useRef(null); // The <img> element in the lightbox, for requestFullscreen()

            const version = '1.1.0';

            const getImageSizeStyle = () => {
                switch(imageSize) {
                    case 'half': return { width: '50%', height: 'auto' };
                    case 'small': return { width: '25%', height: 'auto' };
                    default: return { width: '100%', height: 'auto' };
                }
            };

            const getImageSizeLabel = () => {
                switch(imageSize) {
                    case 'half': return '50%';
                    case 'small': return '25%';
                    default: return '100%';
                }
            };

            const toggleImageSize = () => {
                if (imageSize === 'full') setImageSize('half');
                else if (imageSize === 'half') setImageSize('small');
                else setImageSize('full');
            };

            // Monitor browser back/forward navigation
            useEffect(() => {
                const handlePopState = () => {
                    console.log('Popstate - URL now:', window.location.pathname);
                    if (window.location.pathname === '/stats') {
                        setCurrentPage('stats');
                    } else {
                        setCurrentPage('board');
                    }
                };

                // Listen for back/forward button navigation
                window.addEventListener('popstate', handlePopState);

                // Also listen for hashchange to catch when user clicks on board links from stats
                const handleHashChange = () => {
                    console.log('Hash changed to:', window.location.hash);
                    setCurrentPage('board');
                };
                window.addEventListener('hashchange', handleHashChange);

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    window.removeEventListener('hashchange', handleHashChange);
                };
            }, []);

            // Initialize Socket.io connection and room for board page
            useEffect(() => {
                // If on stats page, disconnect any existing socket
                if (currentPage === 'stats') {
                    if (socketRef.current) {
                        socketRef.current.disconnect();
                        socketRef.current = null;
                    }
                    return;
                }

                // Get or create room ID from URL hash
                let currentRoomId = window.location.hash.slice(1);
                if (!currentRoomId || currentRoomId.length === 0) {
                    currentRoomId = Math.random().toString(36).slice(2, 8);
                    window.location.hash = currentRoomId;
                }
                setRoomId(currentRoomId);

                // Connect to server
                const socket = io();
                socketRef.current = socket;

                socket.on('connect', () => {
                    socket.emit('join-room', currentRoomId);
                });

                // === SOCKET.IO EVENT HANDLERS ===
                // Server broadcast events that update local state when received.

                socket.on('room-state', (state) => {
                    // Full state on initial join. Includes all messages, title, user count, and PIN.
                    setMessages(state.messages || []);
                    setUserCount(state.userCount || 0);
                    if (state.title) {
                        setBoardTitle(state.title);
                    }
                    if (state.pin) {
                        setBoardPin(state.pin); // Shown in share modal
                    }
                });

                socket.on('new-message', (message) => {
                    console.log('Received message:', message);
                    if (message.file) {
                        console.log('Message has file:', message.file.name);
                    }
                    setMessages(prev => [...prev, message]);
                    setTimeout(() => {
                        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                    }, 50);
                });

                socket.on('delete-message', (id) => {
                    setMessages(prev => prev.filter(m => m.id !== id));
                });

                socket.on('clear-board', () => {
                    setMessages([]);
                });

                socket.on('user-count', (count) => {
                    setUserCount(count);
                });

                socket.on('edit-message', ({ id, text }) => {
                    setMessages(prev => prev.map(m => m.id === id ? { ...m, text } : m));
                });

                socket.on('edit-label', ({ id, label }) => {
                    setMessages(prev => prev.map(m => m.id === id ? { ...m, label } : m));
                });

                socket.on('board-title-change', (newTitle) => {
                    console.log('Board title changed by another user:', newTitle);
                    setBoardTitle(newTitle);
                });

                socket.on('upload-error', (errorMessage) => {
                    // Server rejected file (exceeds 15 MB buffer limit).
                    // This is the fallback for files that somehow bypassed client-side checks.
                    console.error('Upload error from server:', errorMessage);
                    setUploadError(errorMessage);
                    setFile(null); // Clear pending file so user can pick another
                });

                socket.on('error', (error) => {
                    console.error('Socket.io error:', error);
                    setUploadError('Anslutningsfel uppstod. Försök igen.');
                });

                socket.on('disconnect', () => {
                    console.log('Socket disconnected');
                });

                return () => {
                    socket.disconnect();
                };
            }, [currentPage]);

            useEffect(() => {
                document.title = boardTitle;
            }, [boardTitle]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    // Skip when typing in an input or textarea
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                    if (e.key === 'Escape') {
                        setExpandedMessageId(null);
                        setShowShareModal(false);
                        setPinModal(null);
                        setPreviewImage(null);
                        dismissWelcome();
                    }

                    // 'f' opens a lightbox for whichever image the mouse is hovering over.
                    // If a lightbox is already open, 'f' instead triggers browser fullscreen.
                    if (e.key === 'f' || e.key === 'F') {
                        if (previewImgRef.current?.src) {
                            previewImgRef.current.requestFullscreen?.();
                        } else if (hoveredImageRef.current) {
                            const { src, name } = hoveredImageRef.current;
                            setPreviewImage({ src, name });
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            useEffect(() => {
                if (isEditingTitle && titleInputRef.current) {
                    titleInputRef.current.focus();
                    titleInputRef.current.select();
                }
            }, [isEditingTitle]);

            const scrollToBottom = () => {
                setTimeout(() => {
                    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                }, 50);
            };

            const handleVerifyPin = async () => {
                setPinLoading(true);
                setPinError('');
                try {
                    const response = await fetch('/api/verify-pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roomId: pinModal.roomId, pin: pinInput })
                    });
                    const data = await response.json();
                    setPinLoading(false);
                    if (data.success) {
                        window.location.href = `/#${pinModal.roomId}`;
                    } else {
                        setPinError(data.error || 'Fel PIN');
                    }
                } catch (error) {
                    console.error('PIN verification error:', error);
                    setPinError('Något gick fel');
                    setPinLoading(false);
                }
            };

            /**
             * handleSendMessage
             * End-to-end file upload with two-layer validation:
             * 1. Client pre-encoding: 10 MB limit (user-friendly, immediate feedback)
             * 2. Client post-encoding: 15 MB limit (matches Socket.io buffer)
             * Server also validates post-encoding as a third defense layer.
             *
             * Base64 encoding adds ~33% size. Example:
             *   10 MB file → 13.3 MB base64 < 15 MB ✓
             *   12 MB file → 15.96 MB base64 > 15 MB ✗
             */
            const handleSendMessage = (e) => {
                if (e) e.preventDefault();
                if (!newMessage.trim() && !file) return;

                setUploadError('');

                // === LAYER 1: PRE-ENCODING VALIDATION ===
                // 10 MB limit for quick feedback before FileReader (which is slow for large files).
                if (file && file.size > 10 * 1024 * 1024) {
                    setUploadError('Filen är för stor. Max 10 MB.');
                    return;
                }

                const newMsg = {
                    id: Date.now(),
                    text: newMessage,
                    file: null,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                };

                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const isImage = file.type.startsWith('image/');
                            const base64Data = event.target.result; // base64 string with "data:..." prefix

                            // === LAYER 2: POST-ENCODING VALIDATION ===
                            // Measure base64 size using Blob, not .length (which counts JS characters, not UTF-8 bytes).
                            // Example: base64Data.length = 13,300,000 chars, but Blob.size = 13,300,000 bytes (UTF-8).
                            // This matches how Socket.io counts buffer size.
                            const base64Blob = new Blob([base64Data]);
                            const base64SizeBytes = base64Blob.size;
                            const base64SizeInMB = base64SizeBytes / (1024 * 1024);
                            const socketIOBufferLimit = 15; // MB

                            console.log('File:', file.name);
                            console.log('Original size:', (file.size / 1024).toFixed(1), 'KB');
                            console.log('Base64 string length:', base64Data.length, 'characters');
                            console.log('Base64 Blob size:', base64SizeBytes.toLocaleString(), 'bytes', '≈', (base64SizeInMB).toFixed(2), 'MB');

                            // Validate base64 size against Socket.io buffer limit
                            if (base64SizeInMB > socketIOBufferLimit) {
                                setUploadError(`Filen är för stor för överföring. Kodad storlek: ${(base64SizeInMB).toFixed(2)} MB (max ${socketIOBufferLimit} MB).`);
                                console.warn('File rejected: exceeds Socket.io buffer limit');
                                return;
                            }

                            newMsg.file = {
                                name: file.name,
                                type: file.type,
                                size: (file.size / 1024).toFixed(1) + " KB",
                                data: base64Data,
                                isImage: isImage
                            };

                            console.log('Sending file:', newMsg.file.name, 'Size:', newMsg.file.size, 'IsImage:', isImage);

                            // Send via Socket.io
                            if (socketRef.current) {
                                socketRef.current.emit('new-message', newMsg);
                                // Clear UI after sending
                                setNewMessage('');
                                setFile(null);
                            }
                        } catch (error) {
                            console.error('Error processing file:', error);
                            setUploadError('Ett fel uppstod vid bearbetning av filen.');
                        }
                    };
                    reader.onerror = (error) => {
                        console.error('File read error:', error);
                        setUploadError('Det gick inte att läsa filen. Försök igen.');
                    };
                    reader.readAsDataURL(file);
                } else {
                    // Send message without file
                    if (socketRef.current) {
                        socketRef.current.emit('new-message', newMsg);
                    }
                    setNewMessage('');
                    setFile(null);
                }
            };

            const deleteMessage = (id) => {
                if (socketRef.current) {
                    socketRef.current.emit('delete-message', id);
                }
            };

            const clearBoard = () => {
                if (socketRef.current) {
                    socketRef.current.emit('clear-board');
                }
            };

            /**
             * saveEdit
             * Optimistic update: update local state immediately, then send to server.
             * If network is slow, user sees the change right away. Server broadcast
             * confirms the change to all users (including this one).
             */
            const saveEdit = (id) => {
                // Update local state immediately (optimistic)
                setMessages(prev => prev.map(m => m.id === id ? { ...m, text: editText } : m));
                setEditingId(null);
                // Send to server asynchronously
                if (socketRef.current) {
                    socketRef.current.emit('edit-message', { id, text: editText });
                }
            };

            const copyMessageText = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    setCopiedMessageId(true); // Brief visual feedback
                    setTimeout(() => setCopiedMessageId(null), 1500);
                });
            };

            const saveLabel = (id) => {
                const label = editLabelText.trim() || 'Inlägg';
                setMessages(prev => prev.map(m => m.id === id ? { ...m, label } : m));
                setEditingLabelId(null);
                if (socketRef.current) {
                    socketRef.current.emit('edit-label', { id, label });

                localStorage.setItem('flyktig_welcomed', '1');
                setShowWelcome(false);

            const copyToClipboard = () => {
                const url = window.location.href;
                navigator.clipboard.writeText(url).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });

            // === CLIENT-SIDE ROUTING ===
            // Check pathname directly (not just currentPage state) to avoid race conditions.
            // Example: user navigates to /stats, but render() might fire before popstate event updates state.
            // By checking pathname directly, we always render the correct page.
            const pathName = window.location.pathname;
            console.log('Rendering - currentPage:', currentPage, 'pathname:', pathName);

            if (pathName === '/stats') {

                                                    {msg.text}

                                                        <div className="absolute inset-0 bg-black/0 hover:bg-black/10 transition-colors flex items-center justify-center">
                                                            <span className="opacity-0 hover:opacity-100 transition-opacity bg-black/50 text-white text-[10px] px-2 py-0.5 rounded">
                                                                klicka eller tryck F
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center justify-between gap-1.5 px-2 py-1.5">

                                                            <span className="text-[8px] text-slate-400">{msg.file.size}</span>
                                                        </div>
                                                        <div className="flex gap-1">
                                                            <button
                                                                onClick={() => setPreviewImage({ src: msg.file.data, name: msg.file.name })}

                                                                <Icon name="maximize-2" size={14} />
                                                            </button>
                                                            {msg.file.data && (
                                                                <button
                                                                    onClick={async () => {
                                                                        try {
                                                                            const response = await fetch(msg.file.data);
                                                                            const blob = await response.blob();
                                                                            const url = URL.createObjectURL(blob);
                                                                            const link = document.createElement('a');
                                                                            link.href = url;
                                                                            link.download = msg.file.name;
                                                                            document.body.appendChild(link);
                                                                            link.click();
                                                                            document.body.removeChild(link);
                                                                            URL.revokeObjectURL(url);
                                                                        } catch (error) {
                                                                            console.error('Download failed:', error);
                                                                            alert('Nedladdning misslyckades');
                                                                        }
                                                                    }}
                                                                    className="p-1 hover:bg-blue-100 text-blue-600 rounded shrink-0"
                                                                >
                                                                    <Icon name="download" size={14} />
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="flex items-center justify-between gap-1.5 p-2">
                                                    <div className="flex items-center gap-2 overflow-hidden">
                                                        <div className="bg-blue-500 p-1 rounded text-white shrink-0">
                                                            <Icon name="file-text" size={12} />
                                                        </div>
                                                        <div className="flex flex-col overflow-hidden min-w-0">
                                                            <span className="text-xs font-bold truncate text-slate-700">{msg.file.name}</span>
                                                            <span className="text-[8px] text-slate-400">{msg.file.size}</span>
                                                        </div>
                                                    </div>
                                                    {msg.file.data && (
                                                        <button
                                                            onClick={async () => {
                                                                try {
                                                                    const response = await fetch(msg.file.data);
                                                                    const blob = await response.blob();
                                                                    const url = URL.createObjectURL(blob);
                                                                    const link = document.createElement('a');
                                                                    link.href = url;
                                                                    link.download = msg.file.name;
                                                                    document.body.appendChild(link);
                                                                    link.click();
                                                                    document.body.removeChild(link);
                                                                    URL.revokeObjectURL(url);
                                                                } catch (error) {
                                                                    console.error('Download failed:', error);
                                                                    alert('Nedladdning misslyckades');

                                                            className="p-1 hover:bg-blue-100 text-blue-600 rounded shrink-0"

                                {file && (

                            </button>
                            <button
                                onClick={(e) => { e.stopPropagation(); previewImgRef.current?.requestFullscreen?.(); }}
                                className="absolute top-4 right-14 p-2 text-white/70 hover:text-white z-10"
                                title="Helskärm"
                            >
                                <Icon name="maximize" size={24} />
                            </button>
                            <img
                                ref={previewImgRef}
                                src={previewImage.src}
                                alt={previewImage.name}
                                className="max-w-[95vw] max-h-[95vh] object-contain rounded shadow-2xl"
                                onClick={(e) => e.stopPropagation()}
                            />
                            <p className="absolute bottom-4 text-white/50 text-xs">{previewImage.name} &nbsp;·&nbsp; Esc för att stänga &nbsp;·&nbsp; F för helskärm</p>
                        </div>
                    )}

                    {/* Share Modal */}
                    {showShareModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-md">
                            <div className="bg-white rounded-2xl sm:rounded-[32px] shadow-2xl w-full max-w-sm overflow-hidden p-4 sm:p-8 flex flex-col items-center relative">
                                <button onClick={() => setShowShareModal(false)} className="absolute top-3 right-3 p-2 text-slate-400 hover:text-slate-600 z-10"><Icon name="x" size={20}/></button>
                                <div className="bg-indigo-600 p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl shadow-indigo-100 mb-4 sm:mb-6 flex items-center justify-center">
                                    <Icon name="share-2" size={48} className="text-white sm:w-16 sm:h-16" />
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">Dela Tavlan</h3>
                                <p className="text-center text-sm text-slate-500 mb-2 sm:mb-3 leading-relaxed">Skicka denna länk för att dela tavlan med andra.</p>
                                <p className="text-center text-xs text-slate-400 mb-4 sm:mb-6 leading-relaxed px-2 py-2 bg-slate-50 rounded-lg">📎 Textmeddelanden synkas mellan användare.</p>
                                <div className="flex flex-col items-center gap-2 sm:gap-4 mb-4 sm:mb-6 w-full">
                                    <img
                                        src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(window.location.href)}`}
                                        alt="QR Code"
                                        className="border-4 border-slate-200 rounded-lg sm:rounded-xl w-40 h-40 sm:w-48 sm:h-48"
                                    />
                                    <p className="text-[10px] text-slate-400 text-center">Skanna med kameran</p>
                                </div>
                                <div className="bg-indigo-50 rounded-xl px-6 py-3 text-center w-full mb-4 sm:mb-6">
                                    <p className="text-xs text-slate-400 mb-2">PIN-kod</p>
                                    <p className="text-3xl font-bold tracking-[0.3em] text-indigo-700">{boardPin || '----'}</p>
                                </div>
                                <button onClick={copyToClipboard} className={`w-full flex items-center justify-center gap-2 py-3 sm:py-4 rounded-2xl font-bold transition-all shadow-lg ${copied ? 'bg-green-500 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                                    {copied ? <><Icon name="check" size={18}/> Kopierat!</> : <><Icon name="copy" size={18}/> Kopiera Länk</>}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
